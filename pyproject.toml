[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/klima"]
force-include = { "src/klima/klima.tcss" = "klima/klima.tcss" }

[project]
name = "klima"
version = "0.1.0"
description = "A terminal based weather app without the bloat of modern web apps."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32.5",
    "textual>=7.5.0",
    "textual-plotext>=0.4.0",
]

[project.scripts]
klima = "klima.main:main"

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pytest>=9.0.3",
    "ruff>=0.14.10",
    "textual-dev>=1.8.0",
]

[tool.ruff]
line-length = 100
python-version = "3.12"
