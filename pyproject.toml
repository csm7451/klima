[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/klima"]

[tool.hatch.build.targets.wheel.force-include]
"src/klima/klima.tcss" = "klima/klima.tcss"
"src/klima/py.typed" = "klima/py.typed"

[project]
name = "klima"
dynamic = ["version"]
description = "A terminal based weather app without the bloat of modern web apps."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
keywords = ["weather", "terminal", "tui", "textual", "cli", "open-meteo"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Terminals :: Terminal Emulators/X Terminals",
]
dependencies = [
    "requests>=2.32.5",
    "textual>=7.5.0",
    "textual-plotext>=0.4.0",
]

[project.scripts]
klima = "klima.main:main"

[project.urls]
Homepage = "https://github.com/YOUR_GITHUB_USER/klima"
Repository = "https://github.com/YOUR_GITHUB_USER/klima"
Issues = "https://github.com/YOUR_GITHUB_USER/klima/issues"
Changelog = "https://github.com/YOUR_GITHUB_USER/klima/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/klima/__init__.py"

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "pytest-textual-snapshot>=1.0.0",
    "responses>=0.26.0",
    "ruff>=0.14.10",
    "textual-dev>=1.8.0",
    "types-requests>=2.33.0.20260503",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.12"
explicit_package_bases = true
mypy_path = ["src"]
files = ["src/klima"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["textual.*", "textual_plotext.*", "plotext"]
ignore_missing_imports = true
