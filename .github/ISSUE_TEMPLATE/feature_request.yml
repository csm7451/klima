name: Feature request
description: Suggest an idea or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Describe the problem you are solving; maintainers may suggest alternatives before implementation.
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What is awkward, missing, or inconsistent today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: How should klima behave instead? CLI flags, keys, layout, etc.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional — other tools or workflows you considered.
