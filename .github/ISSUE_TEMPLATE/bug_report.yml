name: Bug report
description: Something is broken or incorrect
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for filing a bug. Include enough detail so we can reproduce it.
  - type: input
    id: klima-version
    attributes:
      label: klima version
      description: Output of `klima --version` (or approximate commit / install method).
      placeholder: e.g. 1.0.0
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS / terminal emulator / Python version.
      placeholder: macOS Terminal.app, Python 3.13, …
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: Exact command and keys pressed.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual behavior
    validations:
      required: true
